[package]
name = "dnvr-tmux-sidebar"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[features]
default = ["tmux"]
tmux = [
  "dep:crossterm",
  "dep:ratatui",
  "dep:signal-hook",
  "dep:unicode-width",
  "dep:serde",
  "dep:serde_json",
  "dep:clap_complete",
  "dep:clap_complete_nushell",
]

[[bin]]
name = "dnvr-tmux-sidebar"
path = "src/main.rs"
required-features = ["tmux"]

[[bin]]
name = "dnvr-state"
path = "src/bin/dnvr-state.rs"

[dependencies]
crossterm = { version = "=0.28.1", optional = true }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"], optional = true }
signal-hook = { version = "=0.3.18", optional = true }
unicode-width = { version = "=0.2.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = { version = "4.5", optional = true }
clap_complete_nushell = { version = "4.5", optional = true }
rustix = { version = "=0.38.44", features = ["fs", "process"] }
