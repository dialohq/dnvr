[package]
name = "dnvr-tmux-sidebar"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[dependencies]
axum = "=0.8.4"
csv = "=1.3.1"
crossterm = "=0.28.1"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
signal-hook = "=0.3.18"
tokio = { version = "=1.47.1", features = ["net", "rt", "sync"] }
unicode-width = "=0.2.0"
